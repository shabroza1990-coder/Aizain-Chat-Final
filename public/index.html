<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This line below fixes your phone keyboard and scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aizain Chat</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #121212; color: white; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 8px; max-width: 80%; }
        .user { background: #007bff; align-self: flex-end; }
        .other { background: #333; align-self: flex-start; }
        #input-area { display: flex; padding: 15px; background: #1e1e1e; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; font-size: 16px; }
        button { padding: 10px 20px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; }
        #send-btn { background: #007bff; color: white; }
        #mic-btn { background: #444; font-size: 20px; }
    </style>
</head>
<body>
    <div id="chat-box"></div>
    <div id="input-area">
        <button id="mic-btn">🎤</button>
        <input type="text" id="message-input" placeholder="Type or use mic...">
        <button id="send-btn">Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');

        // Function to show messages
        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send Message
        sendBtn.onclick = () => {
            if (input.value) {
                socket.emit('chat message', input.value);
                appendMessage(input.value, 'user');
                input.value = '';
            }
        };

        // Receive Message
        socket.on('chat message', (msg) => {
            appendMessage(msg, 'other');
        });

        // VOICE MICROPHONE LOGIC
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';

        micBtn.onclick = () => {
            recognition.start();
            micBtn.style.background = 'red'; // Turn red when listening
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            input.value = transcript;
            micBtn.style.background = '#444';
        };

        recognition.onerror = () => {
            micBtn.style.background = '#444';
            alert("Mic error. Make sure to allow microphone access!");
        };
    </script>
</body>
</html>
